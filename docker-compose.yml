services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wildlife}
      POSTGRES_USER: ${POSTGRES_USER:-wildlife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildlife}
    ports:
      - "5433:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-wildlife}:${POSTGRES_PASSWORD:-wildlife}@db:5432/${POSTGRES_DB:-wildlife}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  ranger:
    environment:
      API_PROXY_TARGET: http://api:3000
    build:
      context: .
      dockerfile: apps/ranger/Dockerfile
    ports:
      - "${RANGER_PORT:-5173}:5173"
    depends_on:
      - api

  ops:
    environment:
      API_PROXY_TARGET: http://api:3000
    build:
      context: .
      dockerfile: apps/ops/Dockerfile
    ports:
      - "${OPS_PORT:-5174}:5174"
    depends_on:
      - api

volumes:
  postgis-data:
